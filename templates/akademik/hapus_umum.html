{% extends 'base.html' %}

{% block judul %}Konfirmasi Hapus{% endblock %}

{% block isi %}
<div class="kartu-form">
  <h1>{{ judul }}</h1>
  <p>
    Anda akan menghapus <strong>{{ nama_objek }}</strong>
    {{ keterangan }}. Tindakan ini tidak bisa dibatalkan.
  </p>
  <form method="post" class="aksi-form">
    {% csrf_token %}
    <button type="submit" class="tombol-aksi tombol-bahaya">Ya, hapus</button>
    <a href="{% url kembali %}" class="tombol-batal">Batal</a>
  </form>
</div>
{% endblock %}
